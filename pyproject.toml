[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "form-dropout-poc"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
